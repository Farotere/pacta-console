[project]
name = "pacta-agent"
version = "0.1.0"
description = "Agent Pacta — surveillance des usages IA sur les postes clients"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "mitmproxy>=10.0",
    "click>=8.1",
    "pydantic>=2.0",
]

[project.scripts]
pacta-agent = "agent.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
